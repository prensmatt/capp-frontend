<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/products">🛍️ Capp Store</a>
  </div>

  <div class="navbar-links">
    @if (authService.isLoggedIn() && authService.isAdmin()) {
      <a routerLink="/admin/products">Admin Products</a>
      <a routerLink="/admin/orders">Admin Orders</a>
    } @else {
      <a routerLink="/products">Products</a>
    }

    @if (authService.isLoggedIn()) {
      <button (click)="logout()" class="btn-logout">Logout</button>
    } @else {
      <a routerLink="/login" class="btn-nav-login">Login</a>
      <a routerLink="/signup" class="btn-nav-signup">Sign Up</a>
    }
  </div>
</nav>
