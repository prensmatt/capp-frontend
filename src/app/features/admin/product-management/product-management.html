<div class="container">
  <div class="header">
    <h1>Product Management</h1>
    <div class="nav">
      <a routerLink="/admin/orders">Orders</a>
      <button (click)="openCreateForm()" class="btn-create">+ New Product</button>
    </div>
  </div>

  <div class="success" *ngIf="success">{{ success }}</div>
  <div class="error" *ngIf="error">{{ error }}</div>

  <!-- Form -->
  <div class="form-card" *ngIf="showForm">
    <h2>{{ editingProduct ? 'Edit Product' : 'New Product' }}</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" [(ngModel)]="form.name" name="name" required />
        </div>
        <div class="form-group">
          <label>Slug</label>
          <input type="text" [(ngModel)]="form.slug" name="slug" required />
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="form.description" name="description" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Price</label>
          <input type="number" [(ngModel)]="form.price" name="price" min="0.01" step="0.01" required />
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" [(ngModel)]="form.stock" name="stock" min="0" required />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">
          {{ editingProduct ? 'Update' : 'Create' }}
        </button>
        <button type="button" (click)="cancelForm()" class="btn-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Products Table -->
  <div class="loading" *ngIf="loading">Loading...</div>

  <table *ngIf="!loading && products.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>${{ product.price | number:'1.2-2' }}</td>
        <td>{{ product.stock }}</td>
        <td class="actions">
          <button (click)="openEditForm(product)" class="btn-edit">Edit</button>
          <button (click)="deleteProduct(product.id)" class="btn-delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="empty" *ngIf="!loading && products.length === 0">
    No products yet. Create one!
  </div>
</div>
