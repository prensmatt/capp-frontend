<div class="container">
  <div class="header">
    <h1>Products</h1>
    <a routerLink="/login" class="btn-login">Login</a>
  </div>

  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="loading" *ngIf="loading">Loading products...</div>

  <div class="products-grid" *ngIf="!loading">
    <div class="product-card" *ngFor="let product of products">
      <img
        [src]="product.image_url || 'assets/placeholder.png'"
        [alt]="product.name"
        class="product-image"
      />
      <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p class="description">{{ product.description }}</p>
        <div class="product-footer">
          <span class="price">${{ product.price | number:'1.2-2' }}</span>
          <span class="stock" [class.out-of-stock]="product.stock === 0">
            {{ product.stock > 0 ? product.stock + ' in stock' : 'Out of stock' }}
          </span>
        </div>
        <a [routerLink]="['/products', product.id]" class="btn-view">View Details</a>
      </div>
    </div>

    <div class="empty" *ngIf="products.length === 0">
      No products found.
    </div>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="offset === 0">Previous</button>
    <button (click)="nextPage()" [disabled]="products.length < limit">Next</button>
  </div>
</div>
