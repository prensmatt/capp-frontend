<div class="container">
  <div class="header">
    <h1>Products</h1>
  </div>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <div class="products-grid">
    @for (product of products; track product.id) {
      <div class="product-card">
        <img
          [src]="getImageUrl(product.image_url)"
          [alt]="product.name"
          class="product-image"
        />
        <div class="product-info">
          <h3>{{ product.name }}</h3>
          <p class="description">{{ product.description }}</p>
          <div class="product-footer">
            <span class="price">${{ product.price | number:'1.2-2' }}</span>
            <span class="stock" [class.out-of-stock]="product.stock === 0">
              {{ product.stock > 0 ? product.stock + ' in stock' : 'Out of stock' }}
            </span>
          </div>
          <a [routerLink]="['/products', product.id]" class="btn-view">View Details</a>
        </div>
      </div>
    } @empty {
      <div class="empty">No products found.</div>
    }
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="offset === 0">Previous</button>
    <button (click)="nextPage()" [disabled]="products.length < limit">Next</button>
  </div>
</div>
