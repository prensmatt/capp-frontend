<div class="container">
  <h1>My Profile</h1>

  @if (userInfo) {
    <div class="profile-card">
      <div class="profile-icon">👤</div>
      
      <div class="profile-info">
        <div class="info-row">
          <span class="label">User ID</span>
          <span class="value">{{ userInfo.user_id }}</span>
        </div>
        <div class="info-row">
          <span class="label">Role</span>
          <span class="value role" [class]="'role-' + userInfo.role">
            {{ userInfo.role }}
          </span>
        </div>
      </div>

      <div class="profile-actions">
        <a routerLink="/orders" class="btn-orders">📦 My Orders</a>
        <a routerLink="/products" class="btn-shop">🛍️ Continue Shopping</a>
      </div>
    </div>
  } @else {
    <div class="not-logged-in">
      <p>You are not logged in.</p>
      <a routerLink="/login" class="btn-login">Login</a>
    </div>
  }
</div>
